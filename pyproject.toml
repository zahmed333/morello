[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morello"
version = "0.7.0"
description = "Flag batches of a table whose rows stop making sense together"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["data quality", "data engineering", "anomaly detection", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
authors = [{name = "Zulnorain Ahmed"}]
dependencies = ["numpy", "pandas>=2.0", "lightgbm>=4.0", "pyarrow"]

[project.urls]
Homepage = "https://zulnoraina.com/morello/"
Source = "https://github.com/zahmed333/morello"

[project.scripts]
morello = "morello.cli:main"

[project.optional-dependencies]
duckdb = ["duckdb"]
sql = ["sqlalchemy"]
cloud = ["fsspec"]
spark = ["pyspark"]
dev = ["pytest", "ruff", "duckdb", "pyspark", "dbt-core", "dbt-duckdb"]

[tool.setuptools]
packages = ["morello", "morello.integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research"]  # the experiment scripts behind docs/results.md, kept as they were run

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"assets/**" = ["E501"]  # scripts that draw the brand files contain long SVG strings

[tool.ruff.lint.isort]
known-first-party = ["morello", "conftest"]
